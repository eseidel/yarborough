name: Deploy preview

# Publishes every commit on main to the preview Worker and keeps the built
# `dist` as an artifact. "Promote to production" later redeploys that same
# artifact, so production ships the bytes you previewed.
#
# Deliberately not triggered by pull_request: this repository is public, and
# fork pull requests do not receive secrets, so such runs could only fail.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Preview
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://dev.saycbridge.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Retained so a promotion can reuse this exact build rather than rebuild.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 90
          if-no-files-found: error

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
