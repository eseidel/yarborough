[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yarborough-z3b"
version = "0.1.0"
description = "Vendored z3b bridge bidding engine for Yarborough"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["z3-solver==5.1.0.0"]

[tool.setuptools]
py-modules = ["yarborough_z3b"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "z3b*"]
